[project]
name = "agent-swarm"
version = "0.1.0"
description = "Multi-agent software team that autonomously builds small apps from a natural-language requirement"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "playwright>=1.48.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
swarm = "swarm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
